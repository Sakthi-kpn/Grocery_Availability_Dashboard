name: Build and publish dashboard

# - push: rebuild whenever you change files
# - schedule: once a day at 8:30 AM IST, with a backup run at 11:30 AM IST in case the
#   sheet refreshed late. Picks up the published "Grocery Extract"; any day not yet saved goes to
#   data/daily/ and the site is republished. A backup run with nothing new does nothing.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'     # 8:30 AM IST
    - cron: '0 6 * * *'     # 11:30 AM IST (backup)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch Grocery Extract from Google Sheets
        id: sheet
        run: python fetch_sheet.py

      - name: Save new day to the repo
        if: steps.sheet.outputs.new == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily
          git commit -m "Daily Grocery data from Grocery Extract"
          git pull --rebase origin main
          git push

      - name: Decide whether to publish
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.sheet.outputs.new }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build data.json
        if: steps.decide.outputs.publish == 'true'
        run: |
          python build_data.py data _site_data.json
          mkdir -p _site
          cp index.html _site/
          cp _site_data.json _site/data.json
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: steps.decide.outputs.publish == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
